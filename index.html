<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seatwork 1 + Drill 2</title>

  <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
  <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>


</head>
<body>

  <h1>Seatwork 1 (About Me & Basic Calculator)</h1>
  <br>
  <div id="div1" class="div1"></div>
  <br>

  <div>
    <input type="text" id="num1" placeholder="First Number: ">
    <br>
    <input type="text" id="num2" placeholder="Second Number: ">
    <br><br>

    <button py-click="add">Add</button>
    <br><br>
    <div id="adding"></div><br>

    <button py-click="subtract">Subtract</button>
    <br><br>
    <div id="subtracting"></div><br>

    <button py-click="multiply">Multiply</button>
    <br><br>
    <div id="multiplying"></div><br>

    <button py-click="divide">Divide</button>
    <br><br>
    <div id="dividing"></div>

  </div>

<script type="py" src="main.py"></script>
</body>
</html>
